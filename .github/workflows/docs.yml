name: Build & Deploy docs

on:
  push:
    branches: [ main ]
  # ci.yml, once a release is created: the docs of that version.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Compute short SHA
        id: short-sha
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - run: chmod +x ./gradlew

      - name: Build documentation
        run: ./gradlew :dokkatooGenerate
        env:
          # A release's tag, else the short SHA with -SNAPSHOT
          LIB_VERSION: ${{ inputs.tag || format('{0}-SNAPSHOT', steps.short-sha.outputs.sha) }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  # Deploy job
  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
