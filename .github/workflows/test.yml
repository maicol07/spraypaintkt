name: Tests
on:
  push:
  workflow_call:

jobs:
    test:
        runs-on: macos-14
        permissions:
          contents: read
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup JDK 21
            uses: actions/setup-java@v4
            with:
              java-version: 21
              distribution: 'temurin'

          - name: Setup Gradle
            uses: gradle/actions/setup-gradle@v3

          - run: chmod +x ./gradlew

          - name: Test
            run: ./gradlew test:jvmKotest
