name: Tests
on:
  pull_request:
  workflow_call:

jobs:
    test:
        runs-on: macos-14
        permissions:
          contents: read
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup JDK 21
            uses: actions/setup-java@v5
            with:
              java-version: 21
              distribution: 'temurin'

          - name: Setup Gradle
            uses: gradle/actions/setup-gradle@v6
            with:
              cache-disabled: true

          - run: chmod +x ./gradlew

          - name: Test
            run: ./gradlew :test:jvmKotest
